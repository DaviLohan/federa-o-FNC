<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDT ARENA</title>
    <!--[if mso]>
    <style>body{font-family:Arial,sans-serif!important;}</style>
    <![endif]-->
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #D0D0D0; background-color: #07090D; margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
    <!-- Wrapper -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #07090D;">
        <tr>
            <td align="center" style="padding: 32px 16px;">

                <!-- Main Container -->
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%; background-color: #0B0F16; border-radius: 16px; overflow: hidden; border: 1px solid rgba(214,161,30,0.12);">

                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #D6A11E 0%, #9A7B15 100%); padding: 36px 24px 30px; text-align: center;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center">
                                        <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: 5px; color: #07090D; text-transform: uppercase;">FDT ARENA</h1>
                                        <p style="margin: 8px 0 0; font-size: 11px; color: #07090D; opacity: 0.65; letter-spacing: 2px; text-transform: uppercase; font-weight: 500;">Torneios EA SPORTS FC Pro Clubs</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Gold Accent Line -->
                    <tr>
                        <td style="height: 3px; background: linear-gradient(90deg, #D6A11E 0%, #D6A11E 30%, #0B0F16 100%);"></td>
                    </tr>

                    <!-- Icon Block (optional per email) -->
                    {% block icon %}{% endblock %}

                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px 36px 32px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- Footer Separator -->
                    <tr>
                        <td style="padding: 0 36px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="height: 1px; background: linear-gradient(90deg, transparent 0%, #1a1f2e 50%, transparent 100%);"></td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 24px 36px 30px; text-align: center;">
                            <p style="margin: 0 0 14px; font-size: 12px; color: #555;">&copy; 2026 FDT ARENA. Todos os direitos reservados.</p>
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
                                <tr>
                                    <td style="padding: 0 10px;">
                                        <a href="{{ site_url }}" style="color: #D6A11E; text-decoration: none; font-size: 12px; font-weight: 600;">Acessar Plataforma</a>
                                    </td>
                                    <td style="color: #333; font-size: 12px;">|</td>
                                    <td style="padding: 0 10px;">
                                        <a href="{{ site_url }}/settings" style="color: #D6A11E; text-decoration: none; font-size: 12px; font-weight: 600;">Configurações</a>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin: 14px 0 0; font-size: 11px; color: #3d3d3d;">
                                Você está recebendo este email porque está cadastrado na plataforma FDT ARENA.
                            </p>
                        </td>
                    </tr>

                </table>
                <!-- End Main Container -->

            </td>
        </tr>
    </table>
</body>
</html>
